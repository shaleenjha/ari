<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#121212" />
    <meta name="ari-version" content="18.16.0" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Ari</title>
    <!-- Boot screen and theme-color mirror src/ui/tokens.css (canvas, text-primary, text-secondary); the design lint fails on drift. -->
    <style>
      html, body { margin: 0; background: #121212; color: #F5F5F0; }
      .boot { font: 100%/1.4 'Inter', system-ui, sans-serif; }
      .boot { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
      .boot h1 { font-size: 1.5rem; margin: 4px 0 12px; } .boot p { color: #A89F91; margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" data-testid="boot">
        <h1>Ari</h1>
        <p>Loading.</p>
        <p>If this stays, open this link in Chrome or Safari.</p>
      </div>
    </div>
    <noscript><div class="boot"><p>Ari needs JavaScript. Open this link in Chrome or Safari.</p></div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
