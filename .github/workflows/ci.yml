name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app2/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app2/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  jobs:
    name: jobs (typecheck, gmail fetch/parse/shadow unit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app2/jobs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app2/jobs/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  drafts-eval:
    name: drafts-eval (Quill style harness, synthetic personas)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app2/jobs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app2/jobs/package-lock.json }
      - run: npm ci
      - run: npm run eval:drafts

  sql:
    name: sql (schema, RLS matrix, task commands, job queue, gmail ingest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: bash app2/db/run_tests.sh

  scripts:
    name: scripts (python unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/test_hygiene_scan.py

  e2e:
    name: e2e (Playwright 360/412 px, Chromium + WebKit)
    needs: web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app2/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app2/web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: app2/web/test-results, retention-days: 7 }
