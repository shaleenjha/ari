name: repo-scan
# Oct 24 2026 (scrub build): hard gate against real data in the repo. Runs on EVERY push and PR, docs included
# (ci.yml skips markdown-only pushes; a leak can live in a .md file). About 10 seconds, no dependencies.
# Rules live in scripts/repo_scan.py: secrets and keys, emails outside example domains, phone numbers,
# LinkedIn profile slugs that are not visibly synthetic, and blocked names (stored only as salted hashes).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repo-scan:
    name: repo-scan (no real names, emails, phones, slugs or keys)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/test_repo_scan.py
      - run: python3 scripts/repo_scan.py
