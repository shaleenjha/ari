# Weekly dependency checks (Owner, Oct 24 2026). Grouped so each folder opens at most one PR a week.
# Security fixes open as soon as GitHub knows about them. Owner merges; nothing auto-merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app2/web
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 2
    commit-message: { prefix: "Deps" }
    groups:
      web-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /app2/jobs
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 2
    commit-message: { prefix: "Deps" }
    groups:
      jobs-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "CI" }
    groups:
      actions: { patterns: ["*"] }
